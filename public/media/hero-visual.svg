<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c42;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#ff6b35;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffb84d;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#heroGrad)"/>
  
  <!-- Floating geometric elements -->
  <circle cx="150" cy="100" r="60" fill="none" stroke="#ff8c42" stroke-width="2" opacity="0.3"/>
  <circle cx="450" cy="300" r="80" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.25"/>
  
  <!-- Central design elements -->
  <rect x="120" y="140" width="120" height="120" fill="none" stroke="#ffb84d" stroke-width="2" opacity="0.3" rx="10"/>
  <rect x="360" y="140" width="120" height="120" fill="none" stroke="#ff8c42" stroke-width="2" opacity="0.3" rx="10"/>
  
  <!-- Connecting lines -->
  <path d="M 180 200 Q 300 150 420 200" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>
  
  <!-- Center circle -->
  <circle cx="300" cy="200" r="40" fill="none" stroke="#ff8c42" stroke-width="2" opacity="0.4"/>
  <circle cx="300" cy="200" r="30" fill="none" stroke="#ffb84d" stroke-width="1" opacity="0.3"/>
  
  <!-- Accent dots -->
  <circle cx="300" cy="200" r="5" fill="#ff8c42" opacity="0.6"/>
  <circle cx="300" cy="200" r="8" fill="none" stroke="#ff8c42" stroke-width="1" opacity="0.3"/>
  
  <!-- Wave elements -->
  <path d="M 0 300 Q 150 280 300 300 T 600 300" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
  <path d="M 0 330 Q 150 310 300 330 T 600 330" fill="none" stroke="#ffb84d" stroke-width="1" opacity="0.15" stroke-linecap="round"/>
</svg>