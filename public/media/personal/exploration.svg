<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="exploreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Compass -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="url(#exploreGrad)" stroke-width="2"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="url(#exploreGrad)" stroke-width="1" opacity="0.5"/>
  
  <!-- Cardinal points -->
  <line x1="32" y1="12" x2="32" y2="18" stroke="url(#exploreGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="46" y2="32" stroke="url(#exploreGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="46" stroke="url(#exploreGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="18" y2="32" stroke="url(#exploreGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Diagonal points (smaller) -->
  <line x1="44" y1="20" x2="40" y2="24" stroke="url(#exploreGrad)" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="44" y1="44" x2="40" y2="40" stroke="url(#exploreGrad)" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="20" y1="44" x2="24" y2="40" stroke="url(#exploreGrad)" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="24" y2="24" stroke="url(#exploreGrad)" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="url(#exploreGrad)"/>
</svg>