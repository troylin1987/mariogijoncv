<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="personalVisualGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c42;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffb84d;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#personalVisualGrad)"/>
  
  <!-- Sketch-like elements -->
  <circle cx="150" cy="150" r="60" fill="none" stroke="#ff8c42" stroke-width="2" opacity="0.5"/>
  <circle cx="450" cy="150" r="60" fill="none" stroke="#ffb84d" stroke-width="2" opacity="0.5"/>
  <circle cx="300" cy="280" r="60" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.5"/>
  
  <!-- Inner elements -->
  <g opacity="0.4">
    <polygon points="150,100 190,150 150,200 110,150" fill="#ff8c42"/>
    <polygon points="450,100 490,150 450,200 410,150" fill="#ffb84d"/>
    <polygon points="300,230 340,280 300,330 260,280" fill="#ff6b35"/>
  </g>
  
  <!-- Connecting paths -->
  <path d="M 210 150 Q 300 140 390 150" fill="none" stroke="#ff8c42" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <path d="M 180 190 Q 240 250 270 280" fill="none" stroke="#ffb84d" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <path d="M 420 190 Q 360 250 330 280" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  
  <!-- Central hub -->
  <circle cx="300" cy="160" r="20" fill="none" stroke="#ff8c42" stroke-width="2" opacity="0.4"/>
  <circle cx="300" cy="160" r="15" fill="#ff8c42" opacity="0.3"/>
  
  <!-- Decorative dots -->
  <circle cx="100" cy="100" r="4" fill="#ffb84d" opacity="0.3"/>
  <circle cx="500" cy="100" r="4" fill="#ff8c42" opacity="0.3"/>
  <circle cx="300" cy="350" r="4" fill="#ff6b35" opacity="0.3"/>
  
  <!-- Text area -->
  <text x="300" y="380" font-family="Arial, sans-serif" font-size="14" fill="#ff8c42" text-anchor="middle" opacity="0.3">Personal Projects</text>
</svg>