<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mobileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Phone body -->
  <rect x="18" y="8" width="28" height="48" fill="url(#mobileGrad)" rx="3"/>
  
  <!-- Screen -->
  <rect x="22" y="12" width="20" height="32" fill="#fff" opacity="0.1" rx="2"/>
  
  <!-- Status icons -->
  <circle cx="26" cy="16" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="38" cy="16" r="1.5" fill="#fff" opacity="0.6"/>
  
  <!-- App icons grid -->
  <rect x="24" y="20" width="4" height="4" fill="#fff" opacity="0.5" rx="1"/>
  <rect x="30" y="20" width="4" height="4" fill="#fff" opacity="0.5" rx="1"/>
  <rect x="36" y="20" width="4" height="4" fill="#fff" opacity="0.5" rx="1"/>
  
  <rect x="24" y="26" width="4" height="4" fill="#fff" opacity="0.4" rx="1"/>
  <rect x="30" y="26" width="4" height="4" fill="#fff" opacity="0.4" rx="1"/>
  <rect x="36" y="26" width="4" height="4" fill="#fff" opacity="0.4" rx="1"/>
  
  <!-- Home button -->
  <circle cx="32" cy="48" r="2.5" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
</svg>