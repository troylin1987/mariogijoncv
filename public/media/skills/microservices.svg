  <line x1="38" y1="22" x2="40" y2="22" stroke="url(#microGrad)" stroke-width="1.5" stroke-linecap="round"/>
  
  <line x1="18" y1="28" x2="18" y2="36" stroke="url(#microGrad)" stroke-width="1.5" stroke-linecap="round"/>
