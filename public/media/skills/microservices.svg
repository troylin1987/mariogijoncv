      <stop offset="0%" style="stop-color:#ffb84d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Service boxes -->
  <rect x="12" y="16" width="12" height="12" fill="url(#microGrad)" rx="2"/>
  <rect x="26" y="16" width="12" height="12" fill="url(#microGrad)" rx="2"/>
  <rect x="40" y="16" width="12" height="12" fill="url(#microGrad)" rx="2"/>
  
  <rect x="12" y="36" width="12" height="12" fill="url(#microGrad)" rx="2"/>
  <rect x="26" y="36" width="12" height="12" fill="url(#microGrad)" rx="2"/>
