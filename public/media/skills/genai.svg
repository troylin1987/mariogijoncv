<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Brain lobes -->
  <circle cx="24" cy="24" r="10" fill="url(#aiGrad)"/>
  <circle cx="40" cy="24" r="10" fill="url(#aiGrad)"/>
  
  <!-- Brain stem -->
  <rect x="30" y="34" width="4" height="10" fill="url(#aiGrad)" rx="2"/>
  
  <!-- Neural connections -->
  <line x1="24" y1="34" x2="32" y2="40" stroke="url(#aiGrad)" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="40" y1="34" x2="32" y2="40" stroke="url(#aiGrad)" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Synaptic nodes -->
  <circle cx="20" cy="20" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="32" cy="18" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="44" cy="20" r="2" fill="#fff" opacity="0.7"/>
  
  <!-- Energy pulse -->
  <circle cx="32" cy="44" r="3" fill="url(#aiGrad)"/>
</svg>