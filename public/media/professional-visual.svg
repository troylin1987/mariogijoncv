<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="profVisualGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c42;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#profVisualGrad)"/>
  
  <!-- Enterprise layers -->
  <g opacity="0.3">
    <rect x="50" y="80" width="500" height="60" fill="none" stroke="#ff8c42" stroke-width="2" rx="5"/>
    <rect x="50" y="160" width="500" height="60" fill="none" stroke="#ffb84d" stroke-width="2" rx="5"/>
    <rect x="50" y="240" width="500" height="60" fill="none" stroke="#ff6b35" stroke-width="2" rx="5"/>
  </g>
  
  <!-- Connecting nodes -->
  <circle cx="100" cy="110" r="8" fill="#ff8c42" opacity="0.5"/>
  <circle cx="300" cy="110" r="8" fill="#ff8c42" opacity="0.5"/>
  <circle cx="500" cy="110" r="8" fill="#ff8c42" opacity="0.5"/>
  
  <circle cx="100" cy="190" r="8" fill="#ffb84d" opacity="0.5"/>
  <circle cx="300" cy="190" r="8" fill="#ffb84d" opacity="0.5"/>
  <circle cx="500" cy="190" r="8" fill="#ffb84d" opacity="0.5"/>
  
  <circle cx="100" cy="270" r="8" fill="#ff6b35" opacity="0.5"/>
  <circle cx="300" cy="270" r="8" fill="#ff6b35" opacity="0.5"/>
  <circle cx="500" cy="270" r="8" fill="#ff6b35" opacity="0.5"/>
  
  <!-- Connections -->
  <line x1="100" y1="110" x2="300" y2="110" stroke="#ff8c42" stroke-width="1" opacity="0.4"/>
  <line x1="300" y1="110" x2="500" y2="110" stroke="#ff8c42" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="190" x2="300" y2="190" stroke="#ffb84d" stroke-width="1" opacity="0.4"/>
  <line x1="300" y1="190" x2="500" y2="190" stroke="#ffb84d" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="270" x2="300" y2="270" stroke="#ff6b35" stroke-width="1" opacity="0.4"/>
  <line x1="300" y1="270" x2="500" y2="270" stroke="#ff6b35" stroke-width="1" opacity="0.4"/>
  
  <!-- Vertical flows -->
  <line x1="100" y1="110" x2="100" y2="190" stroke="#ffb84d" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="300" y1="110" x2="300" y2="190" stroke="#ffb84d" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="500" y1="110" x2="500" y2="190" stroke="#ffb84d" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="100" y1="190" x2="100" y2="270" stroke="#ff6b35" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="300" y1="190" x2="300" y2="270" stroke="#ff6b35" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="500" y1="190" x2="500" y2="270" stroke="#ff6b35" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  
  <!-- Title area -->
  <text x="300" y="350" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ff8c42" text-anchor="middle" opacity="0.4">Enterprise Architecture</text>
</svg>