<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Ticket -->
  <rect x="14" y="18" width="36" height="28" fill="url(#ticketGrad)" rx="2"/>
  
  <!-- Ticket details -->
  <line x1="18" y1="26" x2="46" y2="26" stroke="#fff" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <line x1="18" y1="32" x2="46" y2="32" stroke="#fff" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="18" y1="38" x2="36" y2="38" stroke="#fff" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  
  <!-- Perforated line -->
  <line x1="50" y1="18" x2="50" y2="46" stroke="#fff" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  
  <!-- Stub -->
  <rect x="50" y="22" width="8" height="20" fill="url(#ticketGrad)" opacity="0.5" rx="1"/>
</svg>