<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ibmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Badge background circle -->
  <circle cx="32" cy="32" r="28" fill="url(#ibmGrad)"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Star at top -->
  <polygon points="32,10 36,20 47,20 38,28 42,38 32,31 22,38 26,28 17,20 28,20" fill="#fff" opacity="0.9"/>
  
  <!-- Text indicator -->
  <text x="32" y="48" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle" opacity="0.8">IBM</text>
  
  <!-- Inner design -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#fff" stroke-width="1" opacity="0.3" stroke-dasharray="2,2"/>
