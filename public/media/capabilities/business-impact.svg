<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="businessGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffb84d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Chart bars -->
  <rect x="12" y="38" width="8" height="14" fill="url(#businessGrad)" rx="2"/>
  <rect x="28" y="28" width="8" height="24" fill="url(#businessGrad)" rx="2"/>
  <rect x="44" y="18" width="8" height="34" fill="url(#businessGrad)" rx="2"/>
  
  <!-- Trend arrow up -->
  <path d="M 16 35 Q 28 15 48 8" fill="none" stroke="url(#businessGrad)" stroke-width="2" stroke-linecap="round"/>
  <polygon points="48,8 52,14 44,12" fill="url(#businessGrad)"/>
  
  <!-- Data points on trend -->
  <circle cx="16" cy="35" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="28" cy="24" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="44" cy="14" r="2" fill="#fff" opacity="0.7"/>
  
  <!-- Base line -->
  <line x1="10" y1="52" x2="54" y2="52" stroke="url(#businessGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>