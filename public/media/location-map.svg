<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="locationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c42;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Map background -->
  <rect width="600" height="400" fill="url(#locationGrad)"/>
  
  <!-- Grid pattern (map) -->
  <g opacity="0.15">
    <line x1="0" y1="0" x2="600" y2="0" stroke="#ff8c42" stroke-width="1"/>
    <line x1="0" y1="50" x2="600" y2="50" stroke="#ff8c42" stroke-width="1"/>
    <line x1="0" y1="100" x2="600" y2="100" stroke="#ff8c42" stroke-width="1"/>
    <line x1="0" y1="150" x2="600" y2="150" stroke="#ff8c42" stroke-width="1"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#ff8c42" stroke-width="1"/>
    <line x1="0" y1="250" x2="600" y2="250" stroke="#ff8c42" stroke-width="1"/>
    <line x1="0" y1="300" x2="600" y2="300" stroke="#ff8c42" stroke-width="1"/>
    <line x1="0" y1="350" x2="600" y2="350" stroke="#ff8c42" stroke-width="1"/>
    <line x1="0" y1="400" x2="600" y2="400" stroke="#ff8c42" stroke-width="1"/>
    
    <line x1="0" y1="0" x2="0" y2="400" stroke="#ff8c42" stroke-width="1"/>
    <line x1="75" y1="0" x2="75" y2="400" stroke="#ff8c42" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="400" stroke="#ff8c42" stroke-width="1"/>
    <line x1="225" y1="0" x2="225" y2="400" stroke="#ff8c42" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#ff8c42" stroke-width="1"/>
    <line x1="375" y1="0" x2="375" y2="400" stroke="#ff8c42" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="400" stroke="#ff8c42" stroke-width="1"/>
    <line x1="525" y1="0" x2="525" y2="400" stroke="#ff8c42" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#ff8c42" stroke-width="1"/>
  </g>
  
  <!-- Location pin -->
  <g transform="translate(300, 150)">
    <circle cx="0" cy="0" r="30" fill="#ff8c42"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="15" fill="#fff" opacity="0.8"/>
    <path d="M -15 0 Q 0 25 0 40 Q 0 25 15 0" fill="#ff8c42" opacity="0.7"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="80" r="25" fill="none" stroke="#ffb84d" stroke-width="1" opacity="0.3"/>
  <circle cx="500" cy="300" r="35" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.3"/>
  
  <!-- Distance circles -->
  <circle cx="300" cy="150" r="50" fill="none" stroke="#ff8c42" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>
  <circle cx="300" cy="150" r="80" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.15" stroke-dasharray="5,5"/>
</svg>