<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mario Gijon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1FBFAD"/>
      <stop offset="55%"  stop-color="#1B98A8"/>
      <stop offset="100%" stop-color="#0A6373"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e2f4f2" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.75">
      <stop offset="0%"   stop-color="#6FBCD1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6FBCD1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)"/>
  <!-- Glow overlay -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#glow)"/>
  <!-- Subtle inner border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="12.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>

  <!-- M letterform — clean geometric, slightly condensed -->
  <path d="M14 47V17h7.5l10.5 18 10.5-18H50v30h-7.5V30l-9.5 16h-2l-9.5-16v17H14z"
        fill="url(#letter)"/>
</svg>
