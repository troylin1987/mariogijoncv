name: Deploy to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      APP_BASE_VERSION: v1.0.0
      VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Log deployment trigger time
        run: echo "Deploy trigger at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - run: npm ci
      - run: npm run build
      - name: Upload to InfinityFree FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftpupload.net
          username: ${{ secrets.FTPUSERNAME }}
          password: ${{ secrets.FTPKEY }}
          local-dir: ./dist/
          server-dir: ./htdocs/
          state-name: .ftp-deploy-sync-state.json
